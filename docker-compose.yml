services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      CHROMA_HOST: db
      CHROMA_PORT: "8000"
    depends_on:
      - db
    networks:
      - veg-vibe-net

  db:
    image: chromadb/chroma:latest
    command: ["chroma", "run", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    networks:
      - veg-vibe-net

networks:
  veg-vibe-net:
    driver: bridge

volumes:
  chroma_data:
